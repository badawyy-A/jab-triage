[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jab-triage"
version = "0.1.0"
description = "Send piles of items to Jev for a label and a confidence, then review only the uncertain ones."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib"]
baseline = ["anthropic"]
dev = ["pytest", "ruff"]

[project.scripts]
jab = "jab_triage.cli:main"

[tool.setuptools.packages.find]
include = ["jab_triage*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
